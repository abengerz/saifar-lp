<!doctype html>
<meta charset="utf-8">
<style>
  @page { size: 1200px 630px; margin: 0 }
  * { margin:0; padding:0; box-sizing:border-box }
  :root{
    --paper:#FBFAF6;
    --ink:#15213C;
    --ink-soft:#5C6780;
    --rule:#DFDCD3;
    --rule-soft:#EDEAE3;
    --amber:#B87C12;
    --amber-soft:#E9B949;
  }
  html,body{ width:1200px; height:630px }
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    font-feature-settings:"palt" 1;
    -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column;
    padding:52px 72px 44px;
  }

  /* ── header ── */
  header{ display:flex; align-items:baseline; gap:18px; padding-bottom:20px; border-bottom:1px solid var(--rule) }
  .mark{ font-size:21px; font-weight:700; letter-spacing:.34em; color:var(--ink) }
  .tag{ font-size:14px; letter-spacing:.06em; color:var(--ink-soft) }
  .spacer{ flex:1 }
  .kicker{ font-size:13.5px; letter-spacing:.08em; color:var(--ink-soft) }

  /* ── headline ── */
  h1{
    margin-top:36px;
    font-size:57px; font-weight:700; line-height:1.34;
    letter-spacing:-.012em;
  }
  h1 .q{ color:var(--ink) }
  h1 em{ font-style:normal; position:relative; white-space:nowrap }
  h1 em::after{
    content:""; position:absolute; left:0; right:0; bottom:6px; height:9px;
    background:var(--amber-soft); opacity:.42; z-index:-1;
  }
  .sub{ margin-top:16px; font-size:17px; line-height:1.75; color:var(--ink-soft); letter-spacing:.02em }

  /* ── chart ── */
  .chart{ margin-top:auto; display:flex; align-items:flex-end; gap:34px }
  .legend{ width:196px; padding-bottom:4px }
  .legend .l-t{ font-size:12.5px; letter-spacing:.1em; color:var(--ink-soft) }
  .legend .l-v{ margin-top:7px; font-size:15px; line-height:1.6; color:var(--ink) }
  .legend .l-v b{ color:var(--amber); font-weight:700 }
  svg{ display:block }

  /* ── footer ── */
  footer{
    margin-top:26px; padding-top:16px; border-top:1px solid var(--rule);
    display:flex; align-items:center; justify-content:space-between;
    font-size:14px; color:var(--ink-soft); letter-spacing:.03em;
  }
  footer .url{ font-family:"SF Mono",Menlo,monospace; font-size:13px; color:#8A93A6 }
</style>

<header>
  <span class="mark">SAIFAR</span>
  <span class="tag">経理代行 × AI</span>
  <span class="spacer"></span>
  <span class="kicker">中小企業の資金繰り可視化</span>
</header>

<h1>
  黒字なのに、現金が足りない。<br>
  その<em>3か月先</em>を、数字で先に見る。
</h1>
<p class="sub">試算表の“結果”ではなく、これから薄くなる月を見立てる。</p>

<div class="chart">
  <div class="legend">
    <div class="l-t">現預金残高の見立て</div>
    <div class="l-v"><b>8月</b>に固定費1か月分を<br>下回る見込み</div>
  </div>

  <svg width="822" height="196" viewBox="0 0 822 196" fill="none">
    <!-- grid -->
    <line x1="0" y1="10"  x2="822" y2="10"  stroke="#EDEAE3" stroke-width="1"/>
    <line x1="0" y1="58"  x2="822" y2="58"  stroke="#EDEAE3" stroke-width="1"/>
    <line x1="0" y1="106" x2="822" y2="106" stroke="#EDEAE3" stroke-width="1"/>
    <line x1="0" y1="154" x2="822" y2="154" stroke="#DFDCD3" stroke-width="1"/>

    <!-- threshold -->
    <line x1="0" y1="128" x2="822" y2="128" stroke="#B87C12" stroke-width="1" stroke-dasharray="3 4" opacity=".55"/>
    <text x="0" y="120" font-size="11.5" fill="#B87C12" font-family="Hiragino Sans" letter-spacing=".06em">固定費1か月分</text>

    <!-- actual (solid) -->
    <path d="M40 52 L170 46 L300 61 L430 74" stroke="#15213C" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- forecast (dashed) -->
    <path d="M430 74 L560 138 L690 150 L800 143" stroke="#B87C12" stroke-width="2.2" stroke-dasharray="6 5" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- dots -->
    <circle cx="40"  cy="52"  r="3.2" fill="#15213C"/>
    <circle cx="170" cy="46"  r="3.2" fill="#15213C"/>
    <circle cx="300" cy="61"  r="3.2" fill="#15213C"/>
    <circle cx="430" cy="74"  r="4"   fill="#15213C"/>
    <circle cx="560" cy="138" r="5.4" fill="#FBFAF6" stroke="#B87C12" stroke-width="2.6"/>
    <circle cx="690" cy="150" r="3.2" fill="#B87C12" opacity=".55"/>
    <circle cx="800" cy="143" r="3.2" fill="#B87C12" opacity=".55"/>

    <!-- axis labels -->
    <text x="34"  y="176" font-size="12.5" fill="#6B7280" font-family="Hiragino Sans">4月</text>
    <text x="164" y="176" font-size="12.5" fill="#6B7280" font-family="Hiragino Sans">5月</text>
    <text x="294" y="176" font-size="12.5" fill="#6B7280" font-family="Hiragino Sans">6月</text>
    <text x="418" y="176" font-size="12.5" fill="#15213C" font-family="Hiragino Sans">今月</text>
    <text x="554" y="176" font-size="12.5" fill="#B87C12" font-family="Hiragino Sans">8月</text>
    <text x="684" y="176" font-size="12.5" fill="#6B7280" font-family="Hiragino Sans">9月</text>
    <text x="792" y="176" font-size="12.5" fill="#6B7280" font-family="Hiragino Sans">10月</text>

    <!-- divider now -->
    <line x1="430" y1="14" x2="430" y2="160" stroke="#C9CDD6" stroke-width="1" stroke-dasharray="2 5"/>
  </svg>
</div>

<footer>
  <span>資金繰り見える化 診断（オンライン30分・無料）</span>
  <span class="url">abengerz.github.io/saifar-lp</span>
</footer>
